name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      non-md: ${{ steps.filter.outputs.non-md }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect non-Markdown changes
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set +e
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            # Three-dot mirrors GitHub's PR diff (merge-base..head).
            files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
            rc=$?
          elif [ -n "$PUSH_BEFORE" ] && [ -n "$PUSH_SHA" ] && [ "$PUSH_BEFORE" != "$ZERO_SHA" ]; then
            files=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA")
            rc=$?
          else
            echo "No valid diff range; defaulting to non-md=true"
            echo "non-md=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -ne 0 ]; then
            echo "git diff failed; defaulting to non-md=true"
            echo "non-md=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed files:"
          echo "$files"
          if [ -z "$files" ] || echo "$files" | grep -qv '\.md$'; then
            echo "non-md=true" >> "$GITHUB_OUTPUT"
          else
            echo "non-md=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore tests/Reactor.Tests/Reactor.Tests.csproj

      - name: Test
        run: dotnet test tests/Reactor.Tests/Reactor.Tests.csproj --no-restore --logger "console;verbosity=normal"

  pack:
    name: Pack
    needs: changes
    if: needs.changes.outputs.non-md == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          # 0.1.0-pr.<num>.<sha7>  for PRs
          # 0.1.0-ci.<run>.<sha7>  for push to main
          $sha = "${{ github.sha }}".Substring(0, 7)
          if ("${{ github.event_name }}" -eq "pull_request") {
            $version = "0.1.0-pr.${{ github.event.number }}.$sha"
          } else {
            $version = "0.1.0-ci.${{ github.run_number }}.$sha"
          }
          Write-Host "Computed version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore framework
        run: dotnet restore src/Reactor/Reactor.csproj

      - name: Pack framework (Microsoft.UI.Reactor)
        run: >
          dotnet pack src/Reactor/Reactor.csproj
          -c Release -p:Platform=x64
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/nupkg

      - name: Pack templates (Microsoft.UI.Reactor.Templates)
        run: >
          dotnet pack src/Reactor.Templates/Reactor.Templates.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/nupkg

      - name: Upload packages
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: |
            artifacts/nupkg/*.nupkg
            artifacts/nupkg/*.snupkg
          retention-days: 14
          if-no-files-found: error
